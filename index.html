<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Necesario para que se vea bien en teléfonos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba técnica</title>

  <meta name="description" content="Prototipo de BinkBe Networker: consulta y comparte tu B-Card digital y explora tus contactos en un evento.">
  <link rel="icon" href="assets/icons/evento.png">

  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- main = contenido principal de la página -->
  <main>

    <!-- ===== VISTA 1: MI B-CARD ===== -->
    <section id="view-bcard" aria-labelledby="bcard-title">
      <header class="page-header">
        <img class="icon icon--header" src="assets/icons/evento.png" alt="">
        <div>
          <h1 id="bcard-title">Mi B-Card</h1>
          <p class="event-name">Expo Networking 2026</p>
        </div>
      </header>

      <article class="card">
        <!-- aria-hidden: las iniciales son decorativas, el nombre ya se lee abajo -->
        <div class="avatar" aria-hidden="true">JD</div>
        <h2 class="card-name">Jane Doe</h2>
        <p class="card-role">CEO</p>
        <p class="card-company">Nube Inc.</p>

        <ul class="card-info">
          <li><img class="icon" src="assets/icons/correo-electronico.png" alt=""> jane_d@nube.example</li>
          <li><img class="icon" src="assets/icons/mensaje-de-telefono.png" alt=""> 55 12 34 56 78</li>
        </ul>

        <!-- button (no div) = se puede usar con teclado y lector de pantalla -->
        <button type="button" class="btn-primary" id="copy-btn">Copiar datos</button>
      </article>
    </section>

    <!-- ===== VISTA 2: CONTACTOS ===== -->
    <!-- hidden = oculta al inicio; JavaScript la muestra -->
    <section id="view-contacts" aria-labelledby="contacts-title" hidden>
      <header class="page-header">
        <img class="icon icon--header" src="assets/icons/evento.png" alt="">
        <div>
          <h1 id="contacts-title">Contactos</h1>
          <p class="event-name">Expo Networking 2026</p>
        </div>
      </header>

      <!-- role="search" ayuda a los lectores de pantalla a encontrar el buscador -->
      <div role="search" class="search">
        <!-- label oculto a la vista, pero leído por lectores de pantalla -->
        <label for="search-input" class="visually-hidden">Buscar contactos</label>
        <input type="search" id="search-input" placeholder="Buscar por nombre, cargo o empresa" autocomplete="off">
        <button type="button" class="search-clear" id="search-clear" aria-label="Borrar búsqueda" hidden>
          <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M19 19L5 5M19 5L5 19"/></svg>
        </button>
      </div>

      <!-- aria-live: anuncia el número de resultados al filtrar -->
      <p class="contacts-count" id="contacts-count" aria-live="polite">3 contactos</p>

      <!-- La lista se llena con JavaScript desde data.js -->
      <ul class="contact-list" id="contact-list"></ul>

      <!-- Estado alternativo: sin resultados -->
      <div class="empty-state" id="no-results" hidden>
        <svg class="empty-icon" aria-hidden="true" focusable="false" viewBox="0 0 16 16"><path fill="currentColor" d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0a5.5 5.5 0 0 1 11 0"/></svg>
        <p class="empty-title">No se encontró a nadie con “<span id="search-term"></span>”</p>
        <p class="empty-hint">Prueba con otro nombre, cargo o empresa</p>
        <button type="button" class="btn-secondary" id="clear-search">Limpiar búsqueda</button>
      </div>
    </section>

    <!-- ===== DETALLE DE CONTACTO ===== -->
    <section id="view-detail" aria-labelledby="detail-name" hidden>
      <button type="button" class="back-btn" id="back-btn">
        <svg class="icon icon--back" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path fill="currentColor" d="M9.31 6.71a.996.996 0 0 0 0 1.41L13.19 12l-3.88 3.88a.996.996 0 1 0 1.41 1.41l4.59-4.59a.996.996 0 0 0 0-1.41L10.72 6.7c-.38-.38-1.02-.38-1.41.01"/></svg>
        Contactos
      </button>
      <!-- El contenido del contacto se llena con JavaScript -->
      <article class="card" id="detail-card"></article>
    </section>

  </main>

  <!-- ===== TOAST DE CONFIRMACIÓN ===== -->
  <!-- role="status" = el lector de pantalla anuncia el mensaje -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- ===== NAVEGACIÓN INFERIOR ===== -->
  <nav class="tab-bar" aria-label="Navegación principal">
    <button type="button" class="tab is-active" data-view="view-bcard" aria-current="page">
      <img class="icon icon--tab" src="assets/icons/licencia-de-conducir.png" alt="">
      Mi B-Card
    </button>
    <button type="button" class="tab" data-view="view-contacts">
      <svg class="icon icon--tab" aria-hidden="true" focusable="false" viewBox="0 0 640 512"><path fill="currentColor" d="M144 0a80 80 0 1 1 0 160a80 80 0 1 1 0-160m368 0a80 80 0 1 1 0 160a80 80 0 1 1 0-160M0 298.7C0 239.8 47.8 192 106.7 192h42.7c15.9 0 31 3.5 44.6 9.7c-1.3 7.2-1.9 14.7-1.9 22.3c0 38.2 16.8 72.5 43.3 96H21.3C9.6 320 0 310.4 0 298.7M405.3 320h-.7c26.6-23.5 43.3-57.8 43.3-96c0-7.6-.7-15-1.9-22.3c13.6-6.3 28.7-9.7 44.6-9.7h42.7c58.9 0 106.7 47.8 106.7 106.7c0 11.8-9.6 21.3-21.3 21.3H405.4zM224 224a96 96 0 1 1 192 0a96 96 0 1 1-192 0m-96 261.3c0-73.6 59.7-133.3 133.3-133.3h117.3c73.7 0 133.4 59.7 133.4 133.3c0 14.7-11.9 26.7-26.7 26.7H154.6c-14.7 0-26.7-11.9-26.7-26.7z"/></svg>
      Contactos
    </button>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
